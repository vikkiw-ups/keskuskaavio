<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Keskussuunnittelija</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ========== TOKENS ========== */
:root{
  --bg:#eef1f4; --card:#fff; --ink:#14171c; --ink2:#5d6674; --ink3:#8b94a3;
  --line:#e3e7ec; --line2:#ccd3dc;
  --red:#d92d20; --red-d:#a81f14; --red-l:#fdeceb;
  --slate:#334155; --steel:#64748b; --mist:#94a3b8;
  --disp:"Space Grotesk","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:600;margin:0}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}

/* ========== RUNKO ========== */
#app{display:flex;flex-direction:column;height:100%}
.appbar{flex:0 0 auto;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line)}
.mark{width:30px;height:30px;flex:0 0 auto;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:16px}
.idbtn{flex:1;min-width:0;text-align:left;padding:5px 8px;border-radius:9px}
.idbtn:active{background:var(--bg)}
.idbtn b{display:block;font-family:var(--disp);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idbtn small{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abtn{flex:0 0 auto;height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.abtn:active{background:var(--bg)}
.abtn.solid{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.abtn.solid:active{background:var(--red-d)}
.deskonly{display:none}

#main{flex:1;min-height:0;position:relative}
.pane{display:none;position:absolute;inset:0;flex-direction:column;overflow:hidden}
.pane.on{display:flex}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{padding:14px 14px calc(24px + var(--safe));max-width:640px;margin:0 auto}

/* ========== ALAPALKKI ========== */
.tabbar{flex:0 0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe)}
.tabbar button{flex:1;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:11.5px;font-weight:500;letter-spacing:.02em}
.tabbar button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--red)}

/* ========== KORTIT ========== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.cardhead{display:flex;align-items:center;gap:10px;padding:13px 14px 11px}
.badge{width:26px;height:26px;flex:0 0 auto;border-radius:7px;background:var(--slate);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;font-weight:600}
.cardhead .t{flex:1;min-width:0}
.cardhead .t b{display:block;font-family:var(--disp);font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardhead .t small{display:block;font-size:12.5px;color:var(--ink3);font-family:var(--mono)}
.cardhead .t small.over{color:var(--red);font-weight:600}
.more{width:38px;height:38px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-size:19px;color:var(--ink2)}
.more:active{background:var(--bg)}

/* moduulipalkki */
.modbar{display:flex;gap:2px;height:14px;margin:0 14px 12px;border-radius:4px;overflow:hidden}
.mb{display:block;border-radius:2px;min-width:3px}
.mb.prot{background:var(--slate)} .mb.rcd{background:var(--red)} .mb.sw{background:var(--steel)}
.mb.other{background:var(--mist)} .mb.blank{background:repeating-linear-gradient(45deg,#dfe4ea 0 3px,#eef1f4 3px 6px)}
.mb.free{background:#e6eaef}
.modbar.over{outline:2px solid var(--red);outline-offset:1px}

/* kojerivit */
.devrow{display:flex;align-items:center;border-top:1px solid var(--line)}
.devmain{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:11px 4px 11px 14px;text-align:left}
.devmain:active{background:var(--bg)}
.gnum{width:30px;height:30px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;background:var(--bg);color:var(--ink2)}
.gnum.has{background:var(--red-l);color:var(--red-d)}
.devtx{flex:1;min-width:0}
.devtx b{display:block;font-size:14.8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devtx small{display:block;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devtx small.none{font-style:italic;opacity:.75}
.arr{width:38px;height:44px;flex:0 0 auto;display:grid;place-items:center;color:var(--ink3);font-size:17px}
.arr:active{background:var(--bg);color:var(--ink)}
.arr:disabled{opacity:.25}
.arr.last{margin-right:6px}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-top:1px solid var(--line);color:var(--red);font-weight:600;font-size:14.5px}
.addbtn:active{background:var(--red-l)}
.emptyrow{padding:16px 14px;color:var(--ink3);font-size:14px;border-top:1px solid var(--line)}

.stack{display:flex;gap:10px}
.stack>*{flex:1}
.bigbtn{padding:13px;border-radius:12px;border:1.5px dashed var(--line2);background:var(--card);font-weight:600;font-size:14.5px;color:var(--ink2)}
.bigbtn:active{background:#e9edf1}
.linkbtn{display:block;width:100%;padding:13px;margin-top:10px;border-radius:12px;background:var(--card);box-shadow:var(--sh);font-weight:600;font-size:14.5px}
.linkbtn:active{background:var(--bg)}
.sectitle{font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:22px 0 9px 4px}
.sectitle:first-child{margin-top:4px}
.note{font-size:13px;color:var(--ink3);line-height:1.55;margin:10px 4px 0}
.note b{color:var(--ink2)}

/* ========== ESIKATSELU ========== */
.pvtop{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--red);box-shadow:var(--sh)}
.pvtools{display:flex;gap:9px;margin-top:9px}
.pvtools .abtn{height:44px}
.pvtools .abtn.solid{flex:1}
#stage{flex:1;overflow:auto;background:#dfe3e8;position:relative;padding:16px 0 24px}
#holder{margin:0 auto}
#scaler{transform-origin:top left}
.sheetpaper{display:none;background:#fff;color:#1a1d22;position:relative;box-shadow:0 6px 26px rgba(16,24,40,.22)}
.sheetpaper.on{display:block}
.zoompill{position:sticky;bottom:10px;float:right;margin-right:12px;display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.96);border:1px solid var(--line2);border-radius:24px;padding:4px;box-shadow:var(--sh);z-index:6}
.zoompill button{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;font-size:18px;color:var(--ink2)}
.zoompill button:active{background:var(--bg)}
.zoompill span{font-family:var(--mono);font-size:12.5px;min-width:46px;text-align:center;color:var(--ink2)}

/* ========== SHEET ========== */
#scrim{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40;opacity:0;transition:opacity .18s}
#scrim.on{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:20px 20px 0 0;max-height:90vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 40px rgba(16,24,40,.2)}
#sheet.on{transform:translateY(0)}
[hidden]{display:none!important}
.shgrip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;flex:0 0 auto}
.shhead{display:flex;align-items:center;gap:10px;padding:10px 14px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.shhead h2{flex:1;font-size:18px}
.shclose{height:38px;padding:0 14px;border-radius:10px;background:var(--bg);font-weight:600;font-size:14px}
.shbody{overflow-y:auto;padding:14px 14px calc(18px + var(--safe));overscroll-behavior:contain}

.f{margin-bottom:15px}
.f>label{display:block;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.f input[type=text],.f input[type=number],.f textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line2);border-radius:11px;background:var(--card)}
.f input:focus,.f textarea:focus{border-color:var(--red);outline:none}
.f textarea{resize:vertical;min-height:78px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line2);background:var(--card);font-size:14.5px;font-weight:500;font-family:var(--mono);min-width:48px;text-align:center}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.chip.wide{font-family:var(--body)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line2);border-radius:11px;overflow:hidden}
.stepper button{width:52px;height:48px;font-size:22px;color:var(--ink2)}
.stepper button:active{background:var(--bg)}
.stepper span{flex:1;text-align:center;font-family:var(--mono);font-size:16px;font-weight:600}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:12px;background:var(--bg);margin-bottom:8px;font-size:15px;font-weight:500;text-align:left}
.rowbtn:active{background:#e4e9ee}
.rowbtn.warn{color:var(--red)}
.rowbtn:disabled{opacity:.4}
.rowbtn .w{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink3);background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.rowbtn.warn .w{color:var(--red)}
.pickhead{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.pickhead::-webkit-scrollbar{display:none}
.pickhead button{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:var(--bg);font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.pickhead button.on{background:var(--ink);color:#fff}
.swrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.swrow:last-child{border-bottom:0}
.swrow span{flex:1;font-size:15px}
.sw{width:50px;height:30px;flex:0 0 auto;border-radius:15px;background:var(--line2);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--red)}
.sw.on::after{transform:translateX(20px)}
#toast{position:fixed;left:50%;bottom:calc(80px + var(--safe));transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ========== PAPERI (tuloste 1:1) ========== */
.frame{position:absolute;inset:8mm;border:.4mm solid #23272e}
.drawarea{position:absolute;left:4mm;right:4mm;top:4mm;bottom:36mm;display:flex;align-items:center;justify-content:center;overflow:hidden}
.panelwrap{position:relative}
#panel{position:relative;transform-origin:top left}
#rot{position:absolute;top:0;left:0;transform-origin:0 0;width:max-content}
.cabinet{border:.5mm solid #23272e;padding:6mm;background:#fff}
.rowblock{margin-bottom:8mm}
.rowblock:last-child{margin-bottom:0}
.rowhead{display:flex;align-items:center;gap:2mm;margin-bottom:1.4mm}
.rowhead .no{font-family:var(--mono);font-weight:700;font-size:2.7mm;color:#fff;background:#23272e;padding:.4mm 1.4mm;border-radius:.5mm}
.rowhead .nm{font-family:var(--disp);font-size:3.2mm;letter-spacing:.06em;text-transform:uppercase;color:#3d444e}
.rail{display:flex;align-items:stretch;position:relative;background:#fff;border:.25mm solid #aab1ba}
.rail::before{content:"";position:absolute;left:0;right:0;top:19mm;height:7mm;background:repeating-linear-gradient(90deg,#e8ebef 0 2mm,#dee2e7 2mm 4mm);border-top:.25mm solid #aab1ba;border-bottom:.25mm solid #aab1ba;z-index:0}
.slot{flex:0 0 auto;height:45mm;border-right:.2mm dashed #ccd2d9;z-index:1}
.slot:last-child{border-right:0}
.dev{position:relative;z-index:2;height:45mm;flex:0 0 auto;background:#fff;border:.35mm solid #23272e;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.dev.sel{outline:.8mm solid var(--red);outline-offset:-.35mm;z-index:4}
.dev .term{height:7mm;flex:0 0 auto;background:repeating-linear-gradient(90deg,#f5f7f9 0 4.6mm,#d5dae1 4.6mm 12.9mm,#f5f7f9 12.9mm 17.5mm);border-bottom:.25mm solid #808993}
.dev .term.b{border-bottom:0;border-top:.25mm solid #808993}
.dev .face{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2mm;padding:1mm .6mm}
.dev.multi .face{background-image:repeating-linear-gradient(90deg,transparent 0 calc(17.5mm - .25mm),#c9cfd7 calc(17.5mm - .25mm) 17.5mm)}
.lever{width:6mm;height:9mm;background:#2a2f37;border-radius:.5mm;position:relative;z-index:2}
.lever::after{content:"";position:absolute;left:1.1mm;right:1.1mm;top:1.3mm;height:2.6mm;background:#c8322a;border-radius:.3mm}
.lever.wide{width:9mm}
.rate{font-family:var(--mono);font-weight:600;font-size:3.2mm;line-height:1;z-index:2;letter-spacing:-.02em}
.sub{font-family:var(--mono);font-size:2.3mm;line-height:1;color:#5b626c;z-index:2}
.tbtn{width:5mm;height:3.4mm;border:.3mm solid #23272e;border-radius:.4mm;display:grid;place-items:center;font-family:var(--mono);font-size:2.2mm;background:#edf0f3;z-index:2}
.vname{font-family:var(--disp);font-size:2.7mm;letter-spacing:.03em;text-transform:uppercase;text-align:center;line-height:1.05;z-index:2}
.vname.rot{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.win{border:.3mm solid #23272e;background:#e9edf1;height:9mm;width:calc(100% - 4mm);display:grid;place-items:center;font-family:var(--mono);font-size:2.7mm;z-index:2}
.lampdot{width:7mm;height:7mm;border-radius:50%;border:.4mm solid #23272e;background:radial-gradient(circle at 38% 34%,#ffb0a6,#d33128)}
.dev.form-blank{background:repeating-linear-gradient(45deg,#f4f6f8 0 1.2mm,#e7ebef 1.2mm 2.4mm);border-color:#9aa2ad}
.dev.form-bus .face{background:#eff2f5}
.busline{width:calc(100% - 3mm);height:6mm;border:.3mm solid #23272e;background:repeating-linear-gradient(90deg,#dfe4ea 0 1.6mm,#fff 1.6mm 4.2mm);display:grid;place-items:center;z-index:2}
.screwrow{display:flex;gap:1.6mm;z-index:2}
.screwrow i{width:2.2mm;height:2.2mm;border-radius:50%;border:.25mm solid #6f7781;background:#fff}
.fusebody{width:24mm;height:24mm;border-radius:50%;border:.4mm solid #23272e;background:radial-gradient(circle at 38% 32%,#fff,#e5e9ee 70%);display:grid;place-items:center;z-index:2}
.fusedot{width:8.5mm;height:8.5mm;border-radius:50%;border:.3mm solid #3a3f47}
.dev.form-fuse .rate{font-size:3.5mm}
.swflag{position:absolute;top:1mm;right:1mm;font-family:var(--mono);font-size:2.2mm;border:.25mm solid #23272e;padding:0 .7mm;z-index:3}
.strip{display:flex;border:.3mm solid #23272e;background:#fff;margin-top:1.6mm}
.strip.cut{border-style:dashed}
.strip .cell{flex:0 0 auto;border-right:.2mm solid #bfc6ce;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4mm;overflow:hidden;padding:.4mm .6mm;text-align:center;line-height:1.12}
.strip .cell:last-child{border-right:0}
.strip .cell .g{font-family:var(--mono);font-weight:700;font-size:calc(var(--fs)*1.1)}
.strip .cell .d{font-family:var(--disp);font-size:var(--fs);overflow-wrap:anywhere}
.strip.vert .cell{writing-mode:vertical-rl;transform:rotate(180deg);flex-direction:row;gap:.8mm}
.strip.vert .cell .d{white-space:nowrap}
.titleblock{position:absolute;right:0;bottom:0;width:112mm;border:.4mm solid #23272e;background:#fff;display:grid;grid-template-columns:24mm 1fr 20mm 1fr}
.titleblock .c{border-right:.25mm solid #b4bbc3;border-bottom:.25mm solid #b4bbc3;padding:1mm 1.5mm;min-height:6.4mm;display:flex;align-items:center}
.titleblock .k{font-family:var(--disp);font-size:2.5mm;letter-spacing:.06em;text-transform:uppercase;color:#6d7480;background:#f5f6f8}
.titleblock .v{font-size:3mm;font-weight:600}
.titleblock .r{border-right:0}
.titleblock .b{border-bottom:0}
.notesbox{position:absolute;left:0;bottom:0;width:calc(100% - 114mm);border:.4mm solid #23272e;background:#fff;padding:1.6mm 2mm;height:30mm;overflow:hidden}
.notesbox h6{margin:0 0 1mm;font-family:var(--disp);font-size:2.5mm;letter-spacing:.06em;text-transform:uppercase;color:#6d7480}
.notesbox p{margin:0;font-size:2.8mm;line-height:1.4;white-space:pre-wrap}
.sheetpaper.flow{padding:10mm;height:auto}
.sheetHead{margin:0 0 6mm}
.sheetHead h1{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:5mm}
.sheetHead p{margin:1mm 0 0;font-size:3mm;color:#5b626c}
.stripblock{margin-bottom:8mm;page-break-inside:avoid;break-inside:avoid}
.stripcap{font-family:var(--disp);font-size:3mm;letter-spacing:.06em;text-transform:uppercase;color:#5b626c;margin-bottom:1.4mm}
.stripcap b{color:#1a1d22}
table.glist{width:100%;border-collapse:collapse;font-size:3mm}
table.glist th{background:#f2f4f6;font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:2.7mm;text-align:left}
table.glist th,table.glist td{border:.25mm solid #9aa2ac;padding:1.2mm 1.8mm;vertical-align:top}
table.glist td.n{font-family:var(--mono);white-space:nowrap}
table.glist tr.sep td{background:#eaedf1;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:2.7mm;font-weight:600}

/* ========== TYÖPÖYTÄ ========== */
@media (min-width:900px){
  body{font-size:14.5px}
  .deskonly{display:inline-flex}
  .tabbar{display:none}
  #main{display:grid;grid-template-columns:400px 1fr}
  .pane{position:relative;display:flex}
  #paneInfo{display:none}
  #paneEdit{border-right:1px solid var(--line);background:var(--card)}
  #paneEdit .wrap{max-width:none;padding:16px}
  .card{box-shadow:none;border:1px solid var(--line)}
  #sheet{left:50%;right:auto;bottom:auto;top:50%;width:460px;max-height:82vh;border-radius:18px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:opacity .16s,transform .16s}
  #sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .shgrip{display:none}
  #toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ========== TULOSTUS ========== */
@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  .appbar,.tabbar,.pvtop,.zoompill,#scrim,#sheet,#toast,#paneEdit,#paneInfo,.no-print{display:none!important}
  #app,#main{display:block;height:auto}
  #panePreview{display:block!important;position:static}
  #stage{overflow:visible;background:#fff;padding:0;display:block}
  #holder{margin:0!important;width:auto!important;height:auto!important}
  #scaler{transform:none!important}
  .sheetpaper{box-shadow:none!important;margin:0}
  .sheetpaper.flow{padding:0!important;width:auto!important;min-height:0!important}
  .dev.sel{outline:none!important}
  .rowblock,.stripblock{page-break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">

<header class="appbar">
  <div class="mark">⌁</div>
  <button class="idbtn" id="btnInfo"><b id="idName">JK1</b><small id="idSub">Keskuksen tiedot</small></button>
  <button class="abtn deskonly" id="btnMore2">Työ</button>
  <button class="abtn solid deskonly" id="btnPrint2">Tulosta / PDF</button>
</header>

<div id="main">
  <!-- ===== RIVIT ===== -->
  <section class="pane on" id="paneEdit">
    <div class="scroll"><div class="wrap">
      <div id="rows"></div>
      <div class="stack" style="margin-top:4px">
        <button class="bigbtn" id="addDin">+ Kiskorivi</button>
        <button class="bigbtn" id="addTulppa">+ Sulakerivi</button>
      </div>
      <button class="linkbtn" id="autoNum">Numeroi ryhmät 1…n</button>
      <p class="note">Napauta kojetta muokataksesi sitä. Nuolilla vaihdat järjestystä. Palkki kortin yläreunassa näyttää, paljonko kiskosta on käytössä.</p>
    </div></div>
  </section>

  <!-- ===== KUVA ===== -->
  <section class="pane" id="panePreview">
    <div class="pvtop">
      <div class="seg" id="viewSeg">
        <button data-view="drawing" class="on">Piirustus</button>
        <button data-view="labels">Liuskat</button>
        <button data-view="list">Luettelo</button>
      </div>
      <div class="pvtools">
        <button class="abtn solid" id="btnPrint">Tulosta / PDF</button>
        <button class="abtn" id="btnPaper">Arkki</button>
      </div>
    </div>
    <div id="stage">
      <div id="holder"><div id="scaler">
        <div class="sheetpaper on" id="paperDrawing" data-view="drawing"></div>
        <div class="sheetpaper flow" id="paperLabels" data-view="labels"></div>
        <div class="sheetpaper flow" id="paperList" data-view="list"></div>
      </div></div>
      <div class="zoompill no-print">
        <button id="zOut">−</button><span id="zVal">100 %</span><button id="zIn">+</button><button id="zFit" style="font-size:14px">↕</button>
      </div>
    </div>
  </section>

  <!-- ===== TIEDOT (mobiili) ===== -->
  <section class="pane" id="paneInfo">
    <div class="scroll"><div class="wrap" id="infoWrap"></div></div>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <button data-pane="paneEdit" class="on">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>Rivit</button>
  <button data-pane="panePreview">
    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Kuva</button>
  <button data-pane="paneInfo">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Tiedot</button>
</nav>
</div>

<div id="scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true">
  <div class="shgrip"></div>
  <div class="shhead"><h2 id="shTitle"></h2><button class="shclose" id="shClose">Valmis</button></div>
  <div class="shbody" id="shBody"></div>
</div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9);
const PXMM = 96 / 25.4;
const PAPER = { A4: { w: 210, h: 297 }, A3: { w: 297, h: 420 } };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const FUSECOL = { "2A": "#f2a0c4", "4A": "#8b5a2b", "6A": "#2fa84f", "10A": "#d92c2c", "16A": "#9aa0a6",
  "20A": "#2b6ce0", "25A": "#f2c200", "35A": "#1a1a1a", "50A": "#f7f7f7", "63A": "#b87333" };
const RATINGS = ["6A","10A","13A","16A","20A","25A","32A","35A","40A","50A","63A","80A"];

/* ---------- kojeluettelo ---------- */
const CATALOG = [
  { key:"js1",  name:"Johdonsuoja 1-nap.",     short:"JS",   w:1, form:"breaker", prot:1, cat:"Suojat", def:{curve:"C",rating:"16A"}, fields:["curve","rating","cable"] },
  { key:"js1n", name:"Johdonsuoja 1-nap. + N", short:"JS+N", w:2, form:"breaker", prot:1, cat:"Suojat", def:{curve:"C",rating:"16A"}, fields:["curve","rating","cable"] },
  { key:"js2",  name:"Johdonsuoja 2-nap.",     short:"JS",   w:2, form:"breaker", prot:1, cat:"Suojat", def:{curve:"C",rating:"16A"}, fields:["curve","rating","cable"] },
  { key:"js3",  name:"Johdonsuoja 3-nap.",     short:"JS",   w:3, form:"breaker", prot:1, cat:"Suojat", def:{curve:"C",rating:"16A"}, fields:["curve","rating","cable"] },
  { key:"rcbo", name:"Vikavirtajohdonsuoja",   short:"RCBO", w:2, form:"rcbo",    prot:1, cat:"Suojat", def:{curve:"C",rating:"16A",ma:"30mA"}, fields:["curve","rating","ma","cable"] },
  { key:"rcd2", name:"Vikavirtasuoja 2-nap.",  short:"VVSK", w:2, form:"rcd",  cat:"Suojat", def:{rating:"40A",ma:"30mA"}, fields:["rating","ma"] },
  { key:"rcd4", name:"Vikavirtasuoja 4-nap.",  short:"VVSK", w:4, form:"rcd",  cat:"Suojat", def:{rating:"40A",ma:"30mA"}, fields:["rating","ma"] },
  { key:"spd",  name:"Ylijännitesuoja T2",     short:"SPD",  w:4, form:"surge",cat:"Suojat", def:{rating:"T2"}, fields:["rating"] },
  { key:"main3",name:"Pääkytkin 3-nap.",       short:"PK",   w:3, form:"switch",cat:"Kytkimet", def:{rating:"63A"}, fields:["rating"] },
  { key:"main4",name:"Kuormanerotin 4-nap.",   short:"PK",   w:4, form:"switch",cat:"Kytkimet", def:{rating:"63A"}, fields:["rating"] },
  { key:"fsw",  name:"Kytkinvaroke 3-nap.",    short:"KV",   w:3, form:"switch",cat:"Kytkimet", def:{rating:"35A"}, fields:["rating"] },
  { key:"ohj",  name:"Ohjauskytkin",           short:"OK",   w:1, form:"switch",cat:"Kytkimet", def:{}, fields:[] },
  { key:"kont", name:"Kontaktori",             short:"K",    w:2, form:"device",cat:"Kytkimet", def:{rating:"25A"}, fields:["rating"] },
  { key:"pva",  name:"Porrasvaloautomaatti",   short:"PVA",  w:1, form:"device",cat:"Ohjaus", def:{}, fields:[] },
  { key:"kello",name:"Kellokytkin",            short:"KELLO",w:2, form:"meter", cat:"Ohjaus", def:{}, fields:[] },
  { key:"rele", name:"Asennusrele",            short:"REL",  w:1, form:"device",cat:"Ohjaus", def:{}, fields:[] },
  { key:"hama", name:"Hämäräkytkin",           short:"HÄM",  w:1, form:"device",cat:"Ohjaus", def:{}, fields:[] },
  { key:"dim",  name:"Himmennin",              short:"DIM",  w:1, form:"device",cat:"Ohjaus", def:{}, fields:[] },
  { key:"trafo",name:"Ovikellomuuntaja 8 V",   short:"TR",   w:2, form:"device",cat:"Ohjaus", def:{}, fields:[] },
  { key:"mitt", name:"Energiamittari",         short:"kWh",  w:4, form:"meter", cat:"Ohjaus", def:{}, fields:[] },
  { key:"lamp", name:"Merkkilamppu",           short:"",     w:1, form:"lamp",  cat:"Ohjaus", def:{}, fields:[] },
  { key:"nkisko",name:"Nollakisko (N)",        short:"N",    w:2, form:"bus",   cat:"Kiskot", def:{}, fields:[] },
  { key:"pekisko",name:"PE-kisko",             short:"PE",   w:2, form:"bus",   cat:"Kiskot", def:{}, fields:[] },
  { key:"rlii", name:"Riviliittimet",          short:"RL",   w:1, form:"terminal",cat:"Kiskot", def:{}, fields:[] },
  { key:"peite",name:"Peitelevy / vapaa",      short:"",     w:1, form:"blank", cat:"Kiskot", def:{}, fields:[] },
  { key:"muu",  name:"Muu koje",               short:"?",    w:1, form:"device",cat:"Kiskot", def:{}, fields:["rating"] },
  { key:"tulppa", name:"Tulppasulake",         short:"TS",   w:2, form:"fuse", prot:1, kinds:["tulppa"], cat:"Sulakkeet", def:{rating:"16A"}, fields:["rating","cable"] },
  { key:"tulppak",name:"Kytkintulppasulake",   short:"KTS",  w:2, form:"fuse", sw:1, prot:1, kinds:["tulppa"], cat:"Sulakkeet", def:{rating:"16A"}, fields:["rating","cable"] },
  { key:"tpaa",   name:"Pääkytkin",            short:"PK",   w:2, form:"switch", kinds:["tulppa"], cat:"Sulakkeet", def:{rating:"25A"}, fields:["rating"] },
  { key:"trima",  name:"Nollarima",            short:"N",    w:2, form:"bus",   kinds:["tulppa"], cat:"Sulakkeet", def:{}, fields:[] },
  { key:"ttyhja", name:"Tyhjä paikka",         short:"",     w:2, form:"blank", kinds:["tulppa"], cat:"Sulakkeet", def:{}, fields:[] }
];
CATALOG.forEach(c => { if (!c.kinds) c.kinds = ["din"]; });
const CAT = Object.fromEntries(CATALOG.map(c => [c.key, c]));
const tint = k => { const f = CAT[k].form;
  if (f === "rcd" || f === "rcbo") return "rcd";
  if (f === "breaker" || f === "fuse") return "prot";
  if (f === "switch") return "sw";
  if (f === "blank") return "blank";
  return "other"; };

/* ---------- tila ---------- */
const newDev = (key, over) => Object.assign({ id: uid(), key, w: CAT[key].w, group: "", desc: "", cable: "" }, CAT[key].def, over || {});
const newRow = (kind, name, modules) => ({ id: uid(), kind, name: name || "Rivi", modules: modules || 12, devices: [] });
function template(which) {
  const base = {
    meta: { kohde: "", osoite: "", tunnus: "JK1", pno: "", tekija: "", pvm: new Date().toLocaleDateString("fi-FI"), ivirta: "", ip: "", huom: "" },
    paper: "A4", orient: "landscape", scaleMode: "fit", form: "vaaka",
    opts: { stripH: 12, fs: 3, mod: 17.5, copies: 1, vert: false, showGroup: true, showEmpty: true },
    rows: []
  };
  if (which === "tyhja") { base.rows = [newRow("din", "Kiskorivi 1", 12)]; return base; }
  if (which === "tulppa") {
    base.meta.tunnus = "RK";
    const r1 = newRow("tulppa", "Sulakerivi 1", 12);
    r1.devices = [newDev("tpaa", { desc: "Pääkytkin" }),
      newDev("tulppa", { rating: "25A", group: "1", desc: "Liesi L1", cable: "MMJ 5x2,5S" }),
      newDev("tulppa", { rating: "25A", group: "1", desc: "Liesi L2" }),
      newDev("tulppa", { rating: "25A", group: "1", desc: "Liesi L3" }),
      newDev("trima", { desc: "Nollarima" }), newDev("ttyhja")];
    const r2 = newRow("tulppa", "Sulakerivi 2", 12);
    r2.devices = [newDev("tulppa", { rating: "10A", group: "2", desc: "Valaistus OH", cable: "MMJ 3x1,5S" }),
      newDev("tulppa", { rating: "10A", group: "3", desc: "Valaistus MH" }),
      newDev("tulppa", { rating: "16A", group: "4", desc: "Pistorasiat OH", cable: "MMJ 3x2,5S" }),
      newDev("tulppa", { rating: "16A", group: "5", desc: "Keittiö" }),
      newDev("tulppa", { rating: "16A", group: "6", desc: "Kylmälaitteet" }), newDev("ttyhja")];
    base.rows = [r1, r2];
    return base;
  }
  const a = newRow("din", "Kiskorivi 1", 12);
  a.devices = [newDev("main4", { rating: "63A", desc: "Pääkytkin" }), newDev("spd", { desc: "Ylijännitesuoja" }), newDev("mitt", { desc: "Energiamittari" })];
  const b = newRow("din", "Kiskorivi 2", 12);
  b.devices = [newDev("rcd4", { rating: "40A", ma: "30mA", desc: "Vikavirtasuoja" }),
    newDev("js1", { rating: "10A", curve: "B", group: "1", desc: "Valaistus OH", cable: "MMJ 3x1,5S" }),
    newDev("js1", { rating: "10A", curve: "B", group: "2", desc: "Valaistus MH", cable: "MMJ 3x1,5S" }),
    newDev("js1", { rating: "16A", curve: "C", group: "3", desc: "Pistorasiat OH", cable: "MMJ 3x2,5S" }),
    newDev("js1", { rating: "16A", curve: "C", group: "4", desc: "Pistorasiat MH", cable: "MMJ 3x2,5S" }),
    newDev("js1", { rating: "16A", curve: "C", group: "5", desc: "Keittiö", cable: "MMJ 3x2,5S" }),
    newDev("js1", { rating: "16A", curve: "C", group: "6", desc: "Kylmälaitteet", cable: "MMJ 3x2,5S" }),
    newDev("peite")];
  const c = newRow("din", "Kiskorivi 3", 12);
  c.devices = [newDev("js3", { rating: "16A", curve: "C", group: "7", desc: "Liesi", cable: "MMJ 5x2,5S" }),
    newDev("js3", { rating: "16A", curve: "C", group: "8", desc: "Sauna", cable: "MMJ 5x2,5S" }),
    newDev("rcbo", { rating: "16A", ma: "30mA", group: "9", desc: "Ulkopistorasiat", cable: "MMJ 3x2,5S" }),
    newDev("nkisko", { desc: "Nollakisko" }), newDev("pekisko", { desc: "PE-kisko" })];
  base.rows = [a, b, c];
  return base;
}

let state = template("asunto");
let view = "drawing";
let selDev = null;
let zoom = 1, zoomAuto = true;

const MOD = () => state.opts.mod || 17.5;
const rowById = id => state.rows.find(r => r.id === id);
const findDev = id => { for (const r of state.rows) { const d = r.devices.find(x => x.id === id); if (d) return { row: r, dev: d }; } return null; };
const used = r => r.devices.reduce((s, d) => s + d.w, 0);
const label = d => [d.curve && d.curve !== "-" ? d.curve : "", d.rating || ""].join("");

/* ============ MUOKKAUSNÄKYMÄ ============ */
function renderRows() {
  $("#rows").innerHTML = state.rows.map((r, i) => {
    const u = used(r), free = Math.max(0, r.modules - u), over = u > r.modules;
    const bars = r.devices.map(d => `<i class="mb ${tint(d.key)}" style="flex:${d.w}" data-dev="${d.id}"></i>`).join("") +
      (free ? `<i class="mb free" style="flex:${free}"></i>` : "");
    const list = r.devices.length ? r.devices.map((d, k) => {
      const c = CAT[d.key], txt = [c.name, label(d)].filter(Boolean).join(" ");
      const extra = d.ma && d.ma !== "-" ? " · " + d.ma : "";
      return `<div class="devrow">
        <button class="devmain" data-edit="${d.id}">
          <span class="gnum ${d.group ? "has" : ""}">${d.group ? esc(d.group) : d.w + "M"}</span>
          <span class="devtx"><b>${esc(txt)}${extra}</b>
            <small class="${d.desc ? "" : "none"}">${d.desc ? esc(d.desc) : "ei merkintätekstiä"}</small></span>
        </button>
        <button class="arr" data-mv="${d.id}" data-dir="-1" ${k === 0 ? "disabled" : ""} aria-label="Siirrä ylös">↑</button>
        <button class="arr last" data-mv="${d.id}" data-dir="1" ${k === r.devices.length - 1 ? "disabled" : ""} aria-label="Siirrä alas">↓</button>
      </div>`;
    }).join("") : `<div class="emptyrow">Rivi on tyhjä.</div>`;
    return `<div class="card">
      <div class="cardhead">
        <span class="badge">${i + 1}</span>
        <span class="t"><b>${esc(r.name)}</b>
          <small class="${over ? "over" : ""}">${r.kind === "din" ? "DIN-kisko" : "Tulppasulakkeet"} · ${u}/${r.modules} mod${over ? " — ei mahdu!" : ""}</small></span>
        <button class="more" data-rowmenu="${r.id}" aria-label="Rivin asetukset">⋯</button>
      </div>
      <div class="modbar ${over ? "over" : ""}">${bars || '<i class="mb free" style="flex:1"></i>'}</div>
      ${list}
      <button class="addbtn" data-addto="${r.id}">+ Lisää koje</button>
    </div>`;
  }).join("");
  $("#idName").textContent = state.meta.tunnus || "Keskus";
  $("#idSub").textContent = state.meta.kohde || "Lisää keskuksen tiedot";
}

/* ============ TIEDOT-VÄLILEHTI ============ */
function renderInfo() {
  $("#infoWrap").innerHTML = `
    <div class="sectitle">Keskus</div>
    <button class="linkbtn" data-open="info" style="margin-top:0">Keskuksen tiedot ja nimiö</button>
    <button class="linkbtn" data-open="paper">Arkki, malli ja liuskat</button>
    <div class="sectitle">Työ</div>
    <button class="linkbtn" style="margin-top:0" id="iSave">Tallenna työ tiedostoksi</button>
    <button class="linkbtn" id="iOpen">Avaa tallennettu työ</button>
    <div class="sectitle">Aloita pohjalla</div>
    <button class="linkbtn" style="margin-top:0" data-tpl="asunto">Asunnon ryhmäkeskus</button>
    <button class="linkbtn" data-tpl="tulppa">Tulppasulakekeskus</button>
    <button class="linkbtn" data-tpl="tyhja">Tyhjä pohja</button>
    <p class="note"><b>Tulostus:</b> avaa Kuva-välilehti, valitse näkymä ja paina Tulosta / PDF. Puhelimessa valitse jakovalikosta “Tulosta” ja sieltä PDF. Merkintäliuskat pitää tulostaa mittakaavassa 100 %, jotta mitat täsmäävät.</p>`;
}

/* ============ PAPERI ============ */
function devInner(d) {
  const c = CAT[d.key], rate = esc(label(d)), poles = Math.max(1, Math.round(d.w));
  switch (c.form) {
    case "breaker": return `<div class="term"></div><div class="face"><div class="lever${d.w > 1 ? " wide" : ""}"></div><div class="rate">${rate || "&nbsp;"}</div></div><div class="term b"></div>`;
    case "rcbo": return `<div class="term"></div><div class="face"><div class="tbtn">T</div><div class="lever"></div><div class="rate">${rate}</div><div class="sub">${esc(d.ma || "")}</div></div><div class="term b"></div>`;
    case "rcd": return `<div class="term"></div><div class="face"><div class="tbtn">T</div><div class="lever wide"></div><div class="rate">${esc(d.rating || "")}</div><div class="sub">${esc(d.ma || "")}</div></div><div class="term b"></div>`;
    case "switch": return `<div class="term"></div><div class="face"><div class="sub">0 / I</div><div class="lever wide" style="height:11mm"></div><div class="rate">${esc(d.rating || "")}</div></div><div class="term b"></div>`;
    case "surge": return `<div class="term"></div><div class="face"><div style="display:flex;gap:1.4mm">${Array.from({length:poles},()=>'<i style="display:block;width:3.4mm;height:6mm;border:.3mm solid #23272e;background:#5ec27a"></i>').join("")}</div><div class="rate">${esc(d.rating || "T2")}</div></div><div class="term b"></div>`;
    case "meter": return `<div class="term"></div><div class="face"><div class="win">${esc(c.short)}</div><div class="sub">${esc(d.rating || "")}</div></div><div class="term b"></div>`;
    case "lamp": return `<div class="term"></div><div class="face"><div class="lampdot"></div></div><div class="term b"></div>`;
    case "terminal": return `<div class="term"></div><div class="face"><div class="screwrow">${Array.from({length:poles*2},()=>"<i></i>").join("")}</div><div class="vname${d.w === 1 ? " rot" : ""}">${esc(d.desc || c.short)}</div></div><div class="term b"></div>`;
    case "bus": return `<div class="face" style="flex:1"><div class="busline"><span class="rate" style="font-size:2.9mm">${esc(c.short)}</span></div><div class="screwrow">${Array.from({length:Math.max(3,poles*2)},()=>"<i></i>").join("")}</div></div>`;
    case "blank": return `<div class="face"></div>`;
    case "fuse": {
      const col = FUSECOL[(d.rating || "").toUpperCase()] || "#c8ccd2";
      return `<div class="term"></div><div class="face">${c.sw ? '<div class="swflag">0/I</div>' : ""}<div class="fusebody"><div class="fusedot" style="background:${col}"></div></div><div class="rate">${esc(d.rating || "")}</div></div><div class="term b"></div>`;
    }
    default: return `<div class="term"></div><div class="face"><div class="vname${d.w === 1 ? " rot" : ""}">${esc(c.short || d.desc || "")}</div>${d.rating ? `<div class="sub">${esc(d.rating)}</div>` : ""}</div><div class="term b"></div>`;
  }
}
function devHTML(d) {
  const cls = ["dev", "form-" + CAT[d.key].form, d.w > 1 ? "multi" : "", d.id === selDev ? "sel" : ""].filter(Boolean).join(" ");
  return `<div class="${cls}" data-dev="${d.id}" style="width:${(d.w * MOD()).toFixed(3)}mm">${devInner(d)}</div>`;
}
function stripHTML(row, dashed) {
  const o = state.opts, m = MOD(), cells = [];
  for (const d of row.devices) {
    const g = o.showGroup && d.group ? `<div class="g">${esc(d.group)}</div>` : "";
    const t = d.desc ? `<div class="d">${esc(d.desc)}</div>` : "";
    cells.push(`<div class="cell" style="width:${(d.w * m).toFixed(3)}mm">${g}${t}</div>`);
  }
  for (let i = 0; i < Math.max(0, row.modules - used(row)); i++) cells.push(`<div class="cell" style="width:${m.toFixed(3)}mm"></div>`);
  const w = Math.max(row.modules, used(row)) * m;
  return `<div class="strip${dashed ? " cut" : ""}${o.vert ? " vert" : ""}" style="width:${w.toFixed(3)}mm;height:${o.stripH}mm;--fs:${o.fs}mm">${cells.join("")}</div>`;
}
function rowBlockHTML(row, i) {
  const m = MOD(), u = used(row), total = Math.max(row.modules, u);
  let slots = "";
  if (state.opts.showEmpty) for (let k = 0; k < Math.max(0, row.modules - u); k++) slots += `<div class="slot" style="width:${m.toFixed(3)}mm"></div>`;
  return `<div class="rowblock">
    <div class="rowhead"><span class="no">${i + 1}</span><span class="nm">${esc(row.name)}</span></div>
    <div class="rail" style="width:${(total * m).toFixed(3)}mm">${row.devices.map(devHTML).join("")}${slots}</div>
    ${stripHTML(row, false)}</div>`;
}
function pageDims() { const p = PAPER[state.paper], l = state.orient === "landscape"; return { w: l ? p.h : p.w, h: l ? p.w : p.h }; }
function titleBlockHTML() {
  const m = state.meta, rows = [];
  if (m.kohde) rows.push({ k1: "Kohde", v1: m.kohde, wide: 1 });
  if (m.osoite) rows.push({ k1: "Osoite", v1: m.osoite, wide: 1 });
  if (m.tunnus || m.pno) rows.push({ k1: "Keskus", v1: m.tunnus, k2: "Piir.nro", v2: m.pno });
  if (m.tekija || m.pvm) rows.push({ k1: "Suunn.", v1: m.tekija, k2: "Päiväys", v2: m.pvm });
  if (m.ivirta || m.ip) rows.push({ k1: "Nim.virta", v1: m.ivirta, k2: "Kotelointi", v2: m.ip });
  rows.push({ k1: "Mittakaava", v1: "1:1", id: "scaleCell" });
  const html = rows.map((r, i) => {
    const b = i === rows.length - 1 ? " b" : "";
    if (r.wide || r.id) return `<div class="c k${b}">${esc(r.k1)}</div><div class="c v r${b}" style="grid-column:2/-1"${r.id ? ` id="${r.id}"` : ""}>${esc(r.v1 || "")}</div>`;
    return `<div class="c k${b}">${esc(r.k1)}</div><div class="c v${b}">${esc(r.v1 || "")}</div><div class="c k${b}">${esc(r.k2)}</div><div class="c v r${b}">${esc(r.v2 || "")}</div>`;
  }).join("");
  return (m.huom ? `<div class="notesbox"><h6>Huomautukset</h6><p>${esc(m.huom)}</p></div>` : "") + `<div class="titleblock">${html}</div>`;
}
function renderDrawing() {
  const { w, h } = pageDims(), p = $("#paperDrawing");
  p.style.width = w + "mm"; p.style.height = h + "mm";
  p.innerHTML = `<div class="frame"><div class="drawarea"><div class="panelwrap"><div id="panel"><div id="rot"><div class="cabinet">
    ${state.rows.map(rowBlockHTML).join("") || '<div style="padding:20mm;font-size:4mm;color:#8a919b">Ei rivejä.</div>'}
    </div></div></div></div></div>${titleBlockHTML()}</div>`;
  fitPanel();
}
function fitPanel() {
  const panel = $("#panel"); if (!panel) return;
  const rot = $("#rot"), cab = rot.firstElementChild, wrap = panel.parentElement, area = wrap.parentElement;
  rot.style.transform = "none"; panel.style.transform = "none";
  const nw = cab.offsetWidth / PXMM, nh = cab.offsetHeight / PXMM;
  if (!nw || !nh) return;
  const vert = state.form === "pysty";
  if (vert) rot.style.transform = "translateY(" + nw.toFixed(3) + "mm) rotate(-90deg)";
  const bw = vert ? nh : nw, bh = vert ? nw : nh;
  panel.style.width = bw + "mm"; panel.style.height = bh + "mm";
  const aw = area.clientWidth / PXMM, ah = area.clientHeight / PXMM;
  let s = 1;
  if (aw > 0 && ah > 0) s = state.scaleMode === "fit" ? Math.min(aw / bw, ah / bh, 1) : (parseFloat(state.scaleMode) || 1);
  panel.style.transform = "scale(" + s + ")";
  wrap.style.width = (bw * s) + "mm"; wrap.style.height = (bh * s) + "mm";
  const cell = $("#scaleCell");
  if (cell) cell.textContent = s >= .999 ? "1:1" : "1:" + (1 / s).toFixed(2).replace(/0+$/, "").replace(/\.$/, "").replace(".", ",");
}
function renderLabels() {
  const { w, h } = pageDims(), p = $("#paperLabels"), o = state.opts, blocks = [];
  p.style.width = w + "mm"; p.style.minHeight = h + "mm";
  state.rows.forEach((r, i) => {
    for (let c = 0; c < (o.copies || 1); c++)
      blocks.push(`<div class="stripblock"><div class="stripcap no-print"><b>${i + 1}. ${esc(r.name)}</b> — ${Math.max(r.modules, used(r))} mod · ${(Math.max(r.modules, used(r)) * MOD()).toFixed(1).replace(".", ",")} × ${String(o.stripH).replace(".", ",")} mm</div>${stripHTML(r, true)}</div>`);
  });
  p.innerHTML = `<div class="sheetHead no-print"><h1>Merkintäliuskat</h1><p>Todellinen koko. Tulosta mittakaavassa 100 % ja leikkaa katkoviivoja pitkin.</p></div>${blocks.join("")}`;
}
function renderList() {
  const { w, h } = pageDims(), p = $("#paperList");
  p.style.width = w + "mm"; p.style.minHeight = h + "mm";
  let body = "";
  state.rows.forEach((r, i) => {
    body += `<tr class="sep"><td colspan="6">${i + 1}. ${esc(r.name)}</td></tr>`;
    r.devices.forEach(d => {

    });
  });

  p.innerHTML = `<div class="sheetHead"><h1>Ryhmäluettelo</h1>${head ? `<p>${esc(head)}</p>` : ""}</div>
    <table class="glist"><thead><tr><th style="width:16mm">Ryhmä</th><th>Koje</th><th style="width:18mm">Suojaus</th>
    <th style="width:18mm">Vikavirta</th><th style="width:32mm">Kaapeli</th><th>Merkintä</th></tr></thead><tbody>${body}</tbody></table>`;
}
function applyZoom() {
  const p = $(".sheetpaper.on"); if (!p) return;
  const w = p.offsetWidth, h = p.offsetHeight;
  if (!w) return;
  if (zoomAuto) zoom = Math.max(.1, Math.min(1.5, ($("#stage").clientWidth - 28) / w));
  $("#scaler").style.transform = "scale(" + zoom + ")";
  $("#holder").style.width = (w * zoom) + "px";
  $("#holder").style.height = (h * zoom) + "px";
  $("#zVal").textContent = Math.round(zoom * 100) + " %";
}
function renderPaper() { renderDrawing(); renderLabels(); renderList(); applyZoom(); }

/* sheet-toiminnot */
$("#shClose").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);
$("#shBody").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const kind = (sheetKind || "").split(":")[0], id = (sheetKind || "").split(":")[1];

  if (b.dataset.open === "save") { doSave(); return; }
  if (b.dataset.open === "load") { $("#fileIn").click(); return; }
  if (b.dataset.open === "info") { sheetInfo(); return; }
  if (b.dataset.open === "paper") { sheetPaper(); return; }
  if (b.dataset.tpl) { loadTemplate(b.dataset.tpl); return; }

  if (kind === "row") {
    const r = rowById(id); if (!r) return;
    if (b.dataset.k) {
      if (b.dataset.k !== r.kind) {
        if (r.devices.length && !confirm("Tyypin vaihto tyhjentää rivin kojeet. Jatketaanko?")) return;
        r.kind = b.dataset.k; r.devices = [];
      }
      $$("#shBody #rKind .chip").forEach(c => c.classList.toggle("on", c.dataset.k === r.kind));
      renderAll(); return;
    }
    if (b.dataset.mod) {
      r.modules = Math.max(1, Math.min(60, r.modules + parseInt(b.dataset.mod)));
      $("#rMod").textContent = r.modules; renderAll(); return;
    }
    const a = b.dataset.ract, i = state.rows.indexOf(r);
    if (a === "dup") { const cp = JSON.parse(JSON.stringify(r)); cp.id = uid(); cp.name = r.name + " (kopio)"; cp.devices.forEach(d => d.id = uid()); state.rows.splice(i + 1, 0, cp); closeSheet(); renderAll(); toast("Rivi monistettu"); }
    if (a === "clear") { r.devices = []; renderAll(); toast("Kojeet poistettu"); }
    if (a === "del") {
      if (state.rows.length === 1) { r.devices = []; toast("Viimeistä riviä ei poisteta"); }
      else { state.rows.splice(i, 1); closeSheet(); toast("Rivi poistettu"); }
      renderAll();
    }
    return;
  }
  if (kind === "pick") {
    if (b.dataset.cat) { pickCat = b.dataset.cat; sheetPicker(id); return; }
    if (b.dataset.pick) {
      const r = rowById(id); r.devices.push(newDev(b.dataset.pick));
      renderAll(); toast(CAT[b.dataset.pick].name + " lisätty"); return;
    }
    return;
  }
  if (kind === "type") {
    if (!b.dataset.newtype) return;
    const f = findDev(id), c = CAT[b.dataset.newtype];
    f.dev.key = c.key; f.dev.w = c.w;
    Object.entries(c.def).forEach(([k, v]) => { if (!f.dev[k]) f.dev[k] = v; });
    renderAll(); sheetDevice(id); return;
  }
  if (kind === "dev") {
    const f = findDev(id); if (!f) return;
    const set = b.closest("[data-set]");
    if (set) {
      const k = set.dataset.set, v = b.dataset.v;
      f.dev[k] = k === "w" ? parseInt(v) : (f.dev[k] === v ? "" : v);
      set.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", String(f.dev[k]) === c.dataset.v));
      if (k === "rating" && $("#dRating")) $("#dRating").value = f.dev.rating || "";
      renderRows(); schedulePaper(); return;
    }
    const a = b.dataset.dact;
    if (a === "type") { sheetTypeChange(id); return; }
    if (a === "up" || a === "down") {
      const arr = f.row.devices, i = arr.indexOf(f.dev), j = i + (a === "up" ? -1 : 1);
      if (j < 0 || j >= arr.length) return;
      arr.splice(i, 1); arr.splice(j, 0, f.dev); renderAll(); sheetDevice(id); return;
    }
    if (a === "dup") {
      const cp = JSON.parse(JSON.stringify(f.dev)); cp.id = uid();
      f.row.devices.splice(f.row.devices.indexOf(f.dev) + 1, 0, cp);
      renderAll(); closeSheet(); toast("Koje monistettu"); return;
    }
    if (a === "del") {
      f.row.devices = f.row.devices.filter(x => x.id !== f.dev.id);
      renderAll(); closeSheet(); toast("Koje poistettu"); return;
    }
    return;
  }
  if (kind === "paper") {
    const seg = b.closest("[data-seg]");
    if (seg) {
      const k = seg.dataset.seg;
      if (k === "form") state.form = b.dataset.v;
      else if (k === "paper") state.paper = b.dataset.v;
      else if (k === "orient") state.orient = b.dataset.v;
      else if (k === "scaleMode") state.scaleMode = b.dataset.v;
      seg.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
      updatePageStyle(); renderPaper(); return;
    }
    if (b.dataset.opt) {
      const k = b.dataset.opt, d = parseInt(b.dataset.d);
      const step = { stripH: .5, fs: .1, mod: .5, copies: 1 }[k];
      const min = { stripH: 4, fs: 1.5, mod: 8, copies: 1 }[k];
      const max = { stripH: 40, fs: 8, mod: 40, copies: 4 }[k];
      state.opts[k] = Math.round(Math.min(max, Math.max(min, state.opts[k] + d * step)) * 10) / 10;
      const el = { stripH: "#oH", fs: "#oF", mod: "#oM", copies: "#oC" }[k];
      $(el).textContent = state.opts[k]; renderPaper(); return;
    }
    if (b.dataset.sw) {
      const k = b.dataset.sw;
      state.opts[k] = !state.opts[k];
      b.classList.toggle("on", state.opts[k]); renderPaper(); return;
    }
  }
});
$("#shBody").addEventListener("input", e => {
  const el = e.target, kind = (sheetKind || "").split(":")[0], id = (sheetKind || "").split(":")[1];
  if (el.dataset.meta) { state.meta[el.dataset.meta] = el.value; renderRows(); schedulePaper(); return; }
  if (kind === "row" && el.id === "rName") { rowById(id).name = el.value; renderRows(); schedulePaper(); return; }
  if (kind === "dev") {
    const f = findDev(id); if (!f) return;
    const map = { dGroup: "group", dDesc: "desc", dCable: "cable", dRating: "rating" };
    const k = map[el.id]; if (!k) return;
    f.dev[k] = el.value;
    if (k === "rating") $$("#shBody [data-set=rating] .chip").forEach(c => c.classList.toggle("on", c.dataset.v === el.value));
    renderRows(); schedulePaper();
  }
});
let pt; function schedulePaper() { clearTimeout(pt); pt = setTimeout(renderPaper, 200); }

/* tiedot-välilehti */
$("#infoWrap").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "iSave") return doSave();
  if (b.id === "iOpen") return $("#fileIn").click();
  if (b.dataset.open === "info") return sheetInfo();
  if (b.dataset.open === "paper") return sheetPaper();
  if (b.dataset.tpl) return loadTemplate(b.dataset.tpl);
});
function loadTemplate(t) {
  if (!confirm("Nykyinen työ korvataan pohjalla. Jatketaanko?")) return;
  state = template(t); view = "drawing"; selDev = null;
  $$("#viewSeg button").forEach(x => x.classList.toggle("on", x.dataset.view === "drawing"));
  $$(".sheetpaper").forEach(p => p.classList.toggle("on", p.dataset.view === "drawing"));
  closeSheet(); updatePageStyle(); renderAll(); showPane("paneEdit"); toast("Pohja ladattu");
}
function doSave() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "keskus_" + (state.meta.tunnus || "kuva").replace(/[^\w\-]+/g, "_") + ".json";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Tallennettu");
}
$("#fileIn").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      if (!o.rows || !Array.isArray(o.rows) || !o.rows.length) throw new Error("bad");
      const base = template("tyhja");
      state = Object.assign(base, o);
      state.opts = Object.assign(base.opts, o.opts || {});
      state.meta = Object.assign(base.meta, o.meta || {});
      if (!state.form) state.form = "vaaka";
      closeSheet(); updatePageStyle(); renderAll(); showPane("paneEdit"); toast("Työ avattu");
    } catch (err) { alert("Tiedostoa ei voitu lukea. Valitse tällä työkalulla tallennettu .json-tiedosto."); }
  };
  fr.readAsText(file); e.target.value = "";
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { fitPanel(); applyZoom(); }, 150); });

renderInfo(); updatePageStyle(); renderAll();
setTimeout(() => { fitPanel(); applyZoom(); }, 60);
</script>
</body>
</html>
